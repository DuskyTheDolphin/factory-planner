[[mods]]
modId="forgeward_planner"
version="2.0.1"
displayName="Factory Planner"
authors="DuskyTheDolphin"
displayURL="https://github.com/DuskyTheDolphin/factory-planner"
description='''
An in-game production calculator for Create and Tinkers' Construct: hover any item (in EMI's lists or an inventory) and press the planner's key, or use /fwplan, to see what speed and how many machines one chain needs.
Reads the recipes the game actually loaded, uses Create's own machine timings and Tinkers' melting and casting timings, and counts drill heads per hour when forgeward_wear is installed. Client only.
'''

[[dependencies.forgeward_planner]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.forgeward_planner]]
    modId="create"
    type="required"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.forgeward_planner]]
    modId="tconstruct"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.forgeward_planner]]
    modId="emi"
    type="required"
    versionRange="[1.1,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.forgeward_planner]]
    modId="forgeward_wear"
    type="optional"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="CLIENT"
